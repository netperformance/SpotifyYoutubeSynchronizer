<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify → YouTube Sync</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <h1>Spotify → YouTube Sync</h1>
  <p class="sub">Einseitige Synchronisation. Spotify ist die Quelle der Wahrheit – Änderungen auf YouTube fließen nie zurück.</p>

  <nav class="tabs">
    <a href="/" class="active">Sync</a>
    <a href="/review">Fehlende Lieder</a>
  </nav>

  <div class="card">
    <div class="row">
      <span id="sp-pill" class="pill off">Spotify: nicht verbunden</span>
      <button class="sp" id="sp-connect" onclick="location.href='/login/spotify'">Spotify verbinden</button>
      <span id="yt-pill" class="pill off">YouTube: nicht verbunden</span>
      <button class="yt" id="yt-connect" onclick="location.href='/login/youtube'">YouTube verbinden</button>
      <span class="spacer"></span>
      <span class="muted" id="quota">Quota: –</span>
    </div>
  </div>

  <div class="card" id="pl-card" style="display:none">
    <div class="row">
      <button class="ghost" onclick="loadPlaylists()">Playlists neu laden</button>
      <span class="spacer"></span>
      <button id="sync-btn" onclick="startSync()" disabled>Auswahl synchronisieren</button>
    </div>

    <div class="opts">
      <label><input type="checkbox" id="remove" checked> Extra-Videos auf YouTube entfernen (exakte Spiegelung)</label>
      <label><input type="checkbox" id="ignore-uncertain" onchange="ignoreUncertainChanged()"> Unsicher erkannte Lieder ignorieren</label>
      <label>Mindest-Trefferqualität: <span id="conf-val">55%</span>
        <input type="range" id="conf" min="0.3" max="0.9" step="0.05" value="0.55" oninput="confVal()">
      </label>
      <button class="ghost mini" onclick="resetUncertain()">Unsichere neu suchen lassen</button>
    </div>

    <div class="row" style="margin-bottom:6px">
      <label class="muted"><input type="checkbox" id="all" onchange="toggleAll()"> alle auswählen</label>
    </div>

    <table>
      <thead><tr><th></th><th>#</th><th>Name</th><th>Tracks</th></tr></thead>
      <tbody id="pl-body"></tbody>
    </table>
  </div>

  <div class="card" id="job-card" style="display:none">
    <div class="row">
      <span class="banner"><span id="job-spin" class="spin"></span><b id="job-state">Synchronisiere …</b></span>
      <span class="muted" id="job-progress"></span>
      <span class="spacer"></span>
      <span class="muted" id="job-quota"></span>
      <button class="ghost mini" id="retry-btn" style="display:none" onclick="retryFailed()">Fehlgeschlagene erneut versuchen</button>
      <button class="danger mini" id="cancel-all" onclick="cancelAll()">Alles abbrechen</button>
    </div>

    <div id="queue" style="margin-top:12px"></div>

    <div id="review-box"></div>

    <details style="margin-top:12px">
      <summary class="muted" style="cursor:pointer">Detailliertes Log anzeigen</summary>
      <pre id="job-log"></pre>
    </details>
  </div>
</div>

<script>
let playlists = [];

async function refreshStatus() {
  const s = await (await fetch('/api/status')).json();
  setPill('sp', 'Spotify', s.spotify);
  setPill('yt', 'YouTube', s.youtube);
  document.getElementById('quota').textContent =
    `Quota heute (geschätzt): ${s.quota_used_today} / ${s.quota_limit}`;
  document.getElementById('sp-connect').style.display = s.spotify ? 'none' : '';
  document.getElementById('yt-connect').style.display = s.youtube ? 'none' : '';
  if (s.spotify) { document.getElementById('pl-card').style.display = ''; if (!playlists.length) loadPlaylists(); }
  return s;
}
function setPill(id, label, on) {
  const e = document.getElementById(id + '-pill');
  e.textContent = `${label}: ${on ? 'verbunden' : 'nicht verbunden'}`;
  e.className = 'pill ' + (on ? 'on' : 'off');
}

const SETTINGS_KEY = 'syncSettings';
function loadSettings() {
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; }
  catch { return {}; }
}
function saveSettings(patch) {
  const s = loadSettings();
  localStorage.setItem(SETTINGS_KEY, JSON.stringify({ ...s, ...patch }));
}

async function loadPlaylists() {
  const r = await fetch('/api/playlists');
  if (!r.ok) { alert('Spotify zuerst verbinden.'); return; }
  playlists = await r.json();
  const body = document.getElementById('pl-body');
  body.innerHTML = '';
  const savedSelection = new Set(loadSettings().selectedPlaylists || []);
  for (const p of playlists) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><input type="checkbox" class="pick" value="${p.id}" onchange="updateBtn()"></td>
      <td class="num">${p.index}.</td><td>${escapeHtml(p.name)}</td><td class="muted">${p.tracks_total}</td>`;
    body.appendChild(tr);
    if (savedSelection.has(p.id)) tr.querySelector('.pick').checked = true;
  }
  updateBtn();
}

function toggleAll() {
  const on = document.getElementById('all').checked;
  document.querySelectorAll('.pick').forEach(c => c.checked = on);
  updateBtn();
}
function updateBtn() {
  const all = [...document.querySelectorAll('.pick')];
  const sel = all.filter(c => c.checked);
  const ytOn = document.getElementById('yt-pill').classList.contains('on');
  document.getElementById('sync-btn').disabled = sel.length === 0 || !ytOn;
  document.getElementById('all').checked = all.length > 0 && sel.length === all.length;
  saveSettings({ selectedPlaylists: sel.map(c => c.value) });
}
function confVal() {
  const v = parseFloat(document.getElementById('conf').value);
  document.getElementById('conf-val').textContent = Math.round(v * 100) + '%';
  saveSettings({ minConfidence: v });
}
function ignoreUncertainChanged() {
  saveSettings({ ignoreUncertain: document.getElementById('ignore-uncertain').checked });
}

let currentJob = null;
let lastQueue = [];

async function submitSync(selected) {
  if (!selected.length) return;
  const body = { playlists: selected,
                 remove_extras: document.getElementById('remove').checked,
                 ignore_uncertain: document.getElementById('ignore-uncertain').checked,
                 min_confidence: parseFloat(document.getElementById('conf').value) };
  const r = await fetch('/api/sync', { method:'POST', headers:{'Content-Type':'application/json'},
                                       body: JSON.stringify(body) });
  if (!r.ok) { alert('Sync-Start fehlgeschlagen: ' + (await r.text())); return; }
  const { job_id } = await r.json();
  currentJob = job_id;
  document.getElementById('retry-btn').style.display = 'none';
  const card = document.getElementById('job-card');
  card.style.display = '';
  card.scrollIntoView({ behavior:'smooth', block:'start' });
  poll(job_id);
}

async function startSync() {
  const picked = [...document.querySelectorAll('.pick:checked')];
  const selected = picked.map(c => {
    const p = playlists.find(x => x.id === c.value);
    return { id: c.value, name: p ? p.name : c.value };
  });
  submitSync(selected);
}

async function retryFailed() {
  const failed = lastQueue.filter(it => it.status === 'error')
    .map(it => ({ id: it.spotify_id, name: it.name }));
  submitSync(failed);
}

async function resetUncertain() {
  const r = await fetch('/api/reset-uncertain', { method:'POST' });
  const { cleared } = await r.json();
  alert(`${cleared} als unsicher gemerkte Lieder zurückgesetzt. Sie werden beim nächsten Sync neu gesucht (kostet Quota).`);
}

async function cancelAll() {
  if (!currentJob) return;
  await fetch(`/api/sync/${currentJob}/cancel`, { method:'POST',
    headers:{'Content-Type':'application/json'}, body:'{}' });
}
async function cancelOne(playlistId) {
  if (!currentJob) return;
  await fetch(`/api/sync/${currentJob}/cancel`, { method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({ playlist_id: playlistId }) });
}

const BADGE = { queued:['b-queued','wartet'], running:['b-running','läuft'],
                done:['b-done','fertig'], cancelled:['b-cancelled','abgebrochen'],
                stopped:['b-stopped','gestoppt'], error:['b-error','fehler'] };

async function poll(jobId) {
  const res = await fetch('/api/sync/' + jobId);
  if (!res.ok) {
    document.getElementById('job-spin').style.display = 'none';
    document.getElementById('job-state').textContent =
      'Kein laufender Job mehr (Server wurde neu gestartet). Starte den Sync neu.';
    document.getElementById('cancel-all').style.display = 'none';
    document.getElementById('retry-btn').style.display = 'none';
    document.getElementById('queue').innerHTML = '';
    currentJob = null;
    refreshStatus();
    return;
  }
  const j = await res.json();

  // Kopf
  const running = j.state === 'running';
  document.getElementById('job-spin').style.display = running ? '' : 'none';
  const st = { running:'Synchronisiere im Hintergrund …', done:'✓ Fertig',
               cancelled:'⏹ Abgebrochen', quota:'⚠ Tageskontingent erreicht',
               error:'✗ Fehler' }[j.state] || j.state;
  document.getElementById('job-state').textContent = st;
  document.getElementById('cancel-all').style.display = running ? '' : 'none';
  const total = j.queue.length;
  const fertig = j.queue.filter(q => ['done','cancelled','error','stopped'].includes(q.status)).length;
  document.getElementById('job-progress').textContent = `${fertig}/${total} Listen verarbeitet`;
  document.getElementById('job-quota').textContent = `Quota heute (geschätzt): ${j.quota_used_today} / ${j.quota_limit}`;
  document.getElementById('job-log').textContent = j.log.join('\n');

  lastQueue = j.queue;
  const hasErrors = j.queue.some(it => it.status === 'error');
  document.getElementById('retry-btn').style.display = (!running && hasErrors) ? '' : 'none';

  // Warteschlange
  const q = document.getElementById('queue');
  q.innerHTML = '';
  for (const it of j.queue) {
    const [cls, label] = BADGE[it.status] || ['b-queued', it.status];
    const stats = (it.status === 'done' || it.status === 'cancelled')
      ? `+${it.added} / -${it.removed} · ${it.review} zu prüfen${it.ignored ? ' · ' + it.ignored + ' ignoriert' : ''}`
      : (it.status === 'running' ? `${it.cached + it.searched} Tracks bearbeitet`
      : (it.status === 'error' ? (it.error || 'Fehler') : ''));
    const canCancel = running && (it.status === 'queued' || it.status === 'running');
    const row = document.createElement('div');
    row.className = 'qrow';
    row.innerHTML =
      `<span class="badge ${cls}">${label}</span>
       <span class="qname">${escapeHtml(it.name)}</span>
       <span class="qstats">${escapeHtml(stats)}</span>` +
      (canCancel ? `<button class="ghost mini" data-id="${it.spotify_id}">abbrechen</button>` : '');
    if (canCancel) row.querySelector('button').onclick = () => cancelOne(it.spotify_id);
    q.appendChild(row);
  }

  renderReview(j.needs_review);

  if (running) setTimeout(() => poll(jobId), 1200);
  else refreshStatus();
}

function renderReview(items) {
  const box = document.getElementById('review-box');
  if (!items || !items.length) { box.innerHTML = ''; return; }
  let html = `<div class="review"><b>Manuelle Prüfung nötig (${items.length})</b>
    <div class="muted">Diese Tracks wurden nicht sicher als Original erkannt und NICHT automatisch übernommen:</div><ul>`;
  for (const it of items)
    html += `<li>${escapeHtml(it.track)} <span class="muted">(beste Trefferqualität ${it.confidence})</span></li>`;
  box.innerHTML = html + '</ul></div>';
}

function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

const initialSettings = loadSettings();
if (typeof initialSettings.minConfidence === 'number') document.getElementById('conf').value = initialSettings.minConfidence;
if (typeof initialSettings.ignoreUncertain === 'boolean') document.getElementById('ignore-uncertain').checked = initialSettings.ignoreUncertain;
confVal();
refreshStatus();
</script>
</body>
</html>
